[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "0.1.0"
description = "Daily ERA5 batch pipeline for the Earth Heat Engine Map"
requires-python = ">=3.12"
dependencies = [
    "cdsapi",
    "ecmwf-datastores-client",
    "xarray",
    "netCDF4",
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
# Publishing to object storage (the daily job)
deploy = [
    "boto3",
]
# One-off tools: exporting colour maps for the front end (pipeline/scripts/)
tools = [
    "matplotlib",
    "cmocean",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Some tests write full-grid NetCDFs; keep temp dirs only for failed tests, and only the last run.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Info-panel prose reads better as whole sentences than wrapped string fragments.
"src/pipeline/info.py" = ["E501"]
